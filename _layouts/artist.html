<h1>{{ page.title }}</h1>
{{ content }}

{% assign author_posts = site.posts | where: "author", page.short_name %}
{% for post in author_posts %}
  <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  {{ post.content }}
{% else %}
  <p>No posts found for this author.</p>
{% endfor %}
